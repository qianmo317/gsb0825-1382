<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素周期表 - Periodic Table</title>
    <style>
        :root {
            --bg-color: #101010;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #00f2ff;
            --glow-color: rgba(0, 242, 255, 0.5);
            --gap: 6px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--glow-color);
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: var(--gap);
            width: 100%;
            position: relative;
        }

        .element {
            position: relative;
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            aspect-ratio: 5/6;
            overflow: hidden;
        }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .periodic-table {
                grid-template-columns: repeat(9, 1fr); /* Split into fewer columns for tablets */
            }
            .element {
                aspect-ratio: 1/1;
            }
            /* Adjust spacers/empty cells handling for mobile layouts if needed, 
               but for a "simple" authentic table, scrolling is often better or a list view.
               However, user asked for "Compatible with PC and H5".
               A full periodic table is very hard on mobile portrait. 
               We will use a scroll container for mobile or a responsive grid.
            */
            .container {
                overflow-x: auto;
                align-items: flex-start; /* Allow scrolling */
            }
            .periodic-table {
                min-width: 900px; /* Force scroll on small screens to keep layout */
            }
        }
        
        /* Mobile specific tweak: if we want it to be truly responsive without scroll, we'd need a list view.
           But "Periodic Table" implies the table layout. Horizontal scroll is standard for tables on mobile.
        */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
                position: sticky;
                left: 20px;
            }
        }

        .element .number {
            font-size: 0.7rem;
            align-self: flex-start;
            margin-left: 5px;
            color: #888;
        }

        .element .symbol {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 2px 0;
            background: linear-gradient(45deg, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .element .name {
            font-size: 0.6rem;
            color: #aaa;
            text-align: center;
        }

        /* Glowing effect */
        .element::before {
            content: "";
            position: absolute;
            top: var(--y, -50%);
            left: var(--x, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle closest-side, var(--glow-color), transparent);
            opacity: 0;
            transition: opacity 0.3s;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: screen;
        }

        .element:hover::before {
            opacity: 0.4;
        }
        
        /* Spotlight effect following mouse on the grid */
        .periodic-table:hover .element::after {
            opacity: 1;
        }

        .element::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 4px;
            border: 2px solid transparent;
            background: radial-gradient(300px circle at var(--mouse-x) var(--mouse-y), rgba(255, 255, 255, 0.3), transparent 40%);
            background-clip: padding-box; /* Limit to content */
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 2;
        }

        /* Highlight specific groups or just general hover */
        .element:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--glow-color);
            border-color: var(--accent-color);
            z-index: 10;
        }

        /* Empty cells for spacing */
        .empty {
            pointer-events: none;
            border: none;
            background: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>化学元素周期表</h1>
        <div class="periodic-table" id="table"></div>
    </div>

    <script src="elements.js"></script>
    <script>
        const tableContainer = document.getElementById('table');

        // We need to fill the grid. 18 columns, rows as needed.
        // We'll create a 2D array or just map positions.
        // Max period here is 5.
        
        for (let p = 1; p <= 5; p++) {
            for (let g = 1; g <= 18; g++) {
                // Find element at this position
                const el = elements.findLast(e => e.p === p && e.g === g);
                const div = document.createElement('div');
                
                if (el) {
                    div.className = 'element';
                    div.innerHTML = `
                        <span class="number">${el.n}</span>
                        <span class="symbol">${el.s}</span>
                        <span class="name">${el.m}</span>
                    `;
                } else {
                    div.className = 'empty';
                }
                
                // Add grid positioning (optional if we fill all cells, but better to use implicit grid if we fill in order)
                // Since we are iterating row by row, column by column, we can just append.
                // However, the gap between H and He needs to be handled.
                // The loop logic handles it by inserting 'empty' divs.
                
                // Exception: Lanthanides/Actinides are usually separate, but we are only doing first 5 periods which don't have them in the main body (except Y/La/Ac placeholders).
                // Actually periods 1-3 have gaps.
                
                tableContainer.appendChild(div);
            }
        }

        // Mouse glow effect
        const table = document.querySelector('.periodic-table');
        
        table.onmousemove = e => {
            for(const card of document.getElementsByClassName("element")) {
                const rect = card.getBoundingClientRect(),
                      x = e.clientX - rect.left,
                      y = e.clientY - rect.top;

                card.style.setProperty("--mouse-x", `${x}px`);
                card.style.setProperty("--mouse-y", `${y}px`);
            }
        };

    </script>
</body>
</html>
